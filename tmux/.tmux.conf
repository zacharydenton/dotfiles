# CTRL-K prefix
unbind-key C-b
set -g prefix C-k
bind-key C-k send-prefix

# Start numbering at 1 and keep windows numbered contiguously
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on

# Allows for faster key repetition
set -s escape-time 0

# Bigger scrollback, pass focus events through to vim, use the system clipboard
set -g history-limit 50000
set -g focus-events on
set -s set-clipboard on

# Set status bar
set -g status-interval 1
set -g status-justify left
set-option -g status-style bg=default
set -g status-fg default
set -g status-left '#[fg=yellow]#H #[default]'
set -g status-left-length 30
set -g status-right '[#[fg=blue]#(uptime | sed "s/.*load average[s]*: //" | sed "s/,//g")#[default]] [#[fg=blue,bright]%H:%M#[default]]'

# Highlight active window
set-window-option -g window-status-current-style fg=green

# Automatically set window title
setw -g automatic-rename
set -g set-titles on
set -g set-titles-string "#I:#W [#P:#{pane_current_command}]"

# True color and extended keys
set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB"
set -as terminal-overrides ",*256col*:Tc"
set -s extended-keys on

# change current window
bind-key -n C-space last-window
bind-key -n C-right next
bind-key -n C-left prev

# use vi bindings in esc mode
set-window-option -g mode-keys vi
set-option -g status-keys vi

# Splitting keybinds
unbind %
bind h split-window -v -c "#{pane_current_path}"
unbind '"'
bind v split-window -h -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Refresh draw
bind l refresh-client

# Reload Config
bind R source-file ~/.tmux.conf \; display-message "tmux.conf reloaded"
